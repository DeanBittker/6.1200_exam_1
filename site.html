<article class="prob" data-id="mod01" data-topic="mod" data-src="Rec 9 #1" data-diff="2" data-title="Four remainder computations">
<div class="q"><p>(a) Last digit of $7^{100}$. (b) $96^{123456789}\bmod97$. (c) $3^{101}\bmod21$. (d) The integers 10 to 99 are written consecutively to form $N=101112\ldots9899$. Find $N\bmod9$.</p></div>
<div class="h">(a) Find a power of 7 that is $\equiv1\pmod{10}$. (b) $96\equiv-1$.</div>
<div class="h">(c) List powers of 3 mod 21 until they repeat. (d) $100\equiv_91$, so $N\equiv$ the sum of the two-digit numbers.</div>
<div class="s">
<p><b>(a)</b> $7^4=2401\equiv_{10}1$, so $7^{100}=(7^4)^{25}\equiv1$. The last digit is <b>1</b>.</p>
<p><b>(b)</b> $96\equiv_{97}-1$ and the exponent is odd, so the result is $-1\equiv$ <b>96</b>.</p>
<p><b>(c)</b> The powers are $3,9,6,18,12,15,3,\dots$ (period 6 from $3^1$). $101=1+6\cdot16+4$, so $3^{101}\equiv3^5\equiv$ <b>12</b>.</p>
<p><b>(d)</b> $N=\sum n_i\cdot100^{j}$ and $100\equiv_91$, so $N\equiv_9\sum_{n=10}^{99}n=4905\equiv_9 4+9+0+5=18\equiv$ <b>0</b>.</p>
<p class="muted">Unofficial solutions; Rec 9 solutions weren't uploaded. Each answer was checked by computer.</p>
</div>
</article>

<article class="prob" data-id="mod02" data-topic="mod" data-src="Rec 9 #2" data-diff="1" data-title="Inverses via the Pulverizer">
<div class="q"><p>Given $k,n\gt0$ with $\gcd(k,n)=1$, show how to use the Pulverizer to find $s$ with $sk\equiv_n1$.</p></div>
<div class="h">The Pulverizer gives $sk+tn=1$. Read that equation mod $n$.</div>
<div class="s"><p>The Pulverizer on $(n,k)$ gives integers $s,t$ with $sk+tn=\gcd(k,n)=1$. Mod $n$, the term $tn\equiv0$, so $sk\equiv_n1$. Take $s\bmod n$ to get the inverse in $[0,n)$.</p></div>
</article>

<article class="prob" data-id="mod03" data-topic="mod" data-src="Rec 9 #3" data-diff="2" data-title="Repeated squaring">
<div class="q"><p>(a) Compute $13^8\bmod100$ by multiplying by 13 each step. (b) Compute $13^2,13^4,13^8,13^{16},13^{32}\bmod100$ by squaring. (c) Find $13^{50}\bmod100$ in 2 more multiplications. (d) Explain why $m^e\bmod n$ takes at most about $2\log_2e$ steps.</p></div>
<div class="h">(c) $50=32+16+2$.</div>
<div class="s">
<p><b>(a)</b> 13, 69, 97, 61, 93, 9, 17, <b>21</b>.</p>
<p><b>(b)</b> $13^2\equiv69$, $13^4\equiv69^2\equiv61$, $13^8\equiv61^2\equiv21$, $13^{16}\equiv21^2\equiv41$, $13^{32}\equiv41^2\equiv81$.</p>
<p><b>(c)</b> $81\cdot41=3321\equiv21$, then $21\cdot69=1449\equiv$ <b>49</b>.</p>
<p><b>(d)</b> $e$ has about $\log_2e$ binary digits. Squaring $\log_2e$ times gives every $m^{2^i}$, and multiplying together those for the 1-bits takes at most $\log_2e$ more steps. Reduce mod $n$ after each step.</p>
<p class="muted">Unofficial solutions, checked by computer.</p>
</div>
</article>

<article class="prob" data-id="mod04" data-topic="mod" data-src="Lecture 9" data-diff="2" data-title="Last two digits of a monster">
<div class="q"><p>Find the last two digits of $x=11335^{11111}\,(6+7799^{5000})$.</p></div>
<div class="h">Work mod 100. Reduce the bases (not the exponents): $11335\equiv35$ and $7799\equiv99\equiv-1$.</div>
<div class="h">Powers of 35 mod 100: 35, 25, 75, 25, 75, …</div>
<div class="s">
<p>$x\equiv_{100}35^{11111}(6+(-1)^{5000})=35^{11111}\cdot7$.</p>
<p>$35^2\equiv25$, $35^3\equiv75$, $35^4\equiv25$, … Odd powers of at least 3 give 75, so $35^{11111}\equiv75$.</p>
<p>$x\equiv75\cdot7=525\equiv$ <b>25</b>.</p>
</div>
</article>

<article class="prob" data-id="mod05" data-topic="mod" data-src="Lecture 9" data-diff="1" data-title="Dividing in a congruence">
<div class="q"><p>(a) Show 3 has no inverse mod 6, using $3\cdot5\equiv_63\cdot1$. (b) 7 and 13 are inverses mod 30. Solve $7x\equiv_{30}14$ and $7x\equiv_{30}12$.</p></div>
<div class="h">Multiply both sides by 13 instead of dividing by 7.</div>
<div class="s">
<p><b>(a)</b> If $3^{-1}$ existed, multiplying $3\cdot5\equiv_63\cdot1$ by it would give $5\equiv_61$, which is false. (Also $\gcd(3,6)=3\ne1$.)</p>
<p><b>(b)</b> $x\equiv13\cdot14=182\equiv$ <b>2</b>, and $x\equiv13\cdot12=156\equiv$ <b>6</b>. Check: $7\cdot6=42\equiv12$ ✓.</p>
</div>
</article>

<article class="prob" data-id="mod06" data-topic="mod" data-src="Lecture 9" data-diff="1" data-title="The divisible-by-9 rule">
<div class="q"><p>Prove that $n\equiv_9 s(n)$, where $s(n)$ is the sum of the decimal digits of $n$. Conclude $9\mid n\iff9\mid s(n)$.</p></div>
<div class="h">Write $n=\sum d_i10^i$ and use $10\equiv_91$.</div>
<div class="s">
<p>$n=\sum_{i=0}^kd_i10^i$. Since $10\equiv_91$, we get $10^i\equiv_91$, so $n\equiv_9\sum d_i=s(n)$. Then $9\mid n\iff n\equiv_90\iff s(n)\equiv_90\iff9\mid s(n)$. ∎</p>
</div>
</article>

<article class="prob" data-id="mod07" data-topic="mod" data-src="Original (PS 5 skills)" data-diff="2" data-title="Inverse of 13 mod 29, two ways">
<div class="q"><p>Find the inverse of 13 modulo 29 in $[0,29)$ (a) with the Pulverizer and (b) with Fermat's Little Theorem plus repeated squaring. Do it by hand.</p></div>
<div class="h">(a) $29=2\cdot13+3$ and $13=4\cdot3+1$.</div>
<div class="h">(b) $13^{-1}\equiv13^{27}$. Compute $13^2,13^4,13^8,13^{16}$ mod 29, then $27=16+8+2+1$.</div>
<div class="s">
<p><b>(a)</b> $3=29-2\cdot13$, so $1=13-4\cdot3=13-4(29-2\cdot13)=9\cdot13-4\cdot29$. The inverse is <b>9</b>. Check: $117=4\cdot29+1$ ✓.</p>
<p><b>(b)</b> $13^2=169\equiv24\equiv-5$; $13^4\equiv25\equiv-4$; $13^8\equiv16$; $13^{16}\equiv256\equiv24\equiv-5$.</p>
<p>$13^{27}=13^{16}\cdot13^8\cdot13^2\cdot13\equiv(-5)(16)(-5)(13)=400\cdot13$. Since $400\equiv_{29}23\equiv-6$, this is $\equiv-78\equiv-78+87=$ <b>9</b> ✓.</p>
</div>
</article>

<article class="prob" data-id="mod08" data-topic="mod" data-src="Original" data-diff="1" data-title="Reduce the exponent with FLT">
<div class="q"><p>Compute (a) $2^{1000}\bmod7$ and (b) $3^{2026}\bmod11$. Say exactly which theorem lets you shrink the exponent and why it applies.</p></div>
<div class="h">FLT: $a^{p-1}\equiv_p1$ for prime $p\nmid a$, so reduce exponents mod $p-1$. For (a) there's an even smaller cycle: $2^3=8\equiv1$.</div>
<div class="s">
<p><b>(a)</b> $2^3\equiv_71$ and $1000=3\cdot333+1$, so $2^{1000}\equiv2$. (FLT with exponent mod 6 also works: $1000\equiv4$, and $2^4=16\equiv2$.)</p>
<p><b>(b)</b> 11 is prime and $11\nmid3$, so $3^{10}\equiv1$. $2026\equiv6\pmod{10}$, so $3^{2026}\equiv3^6=729\equiv$ <b>3</b>. (Also $3^5=243\equiv1$ directly.)</p>
</div>
</article>

<article class="prob" data-id="mod09" data-topic="mod" data-src="Original" data-diff="1" data-title="Solve a linear congruence">
<div class="q"><p>Solve $4x\equiv_97$. Then explain why $6x\equiv_97$ has no solution.</p></div>
<div class="h">$\gcd(4,9)=1$, so 4 has an inverse mod 9. Try small multiples: $4\cdot7=28$.</div>
<div class="s">
<p>$4^{-1}\equiv_97$ (since $28\equiv1$), so $x\equiv7\cdot7=49\equiv$ <b>4</b>. Check: $16\equiv7$ ✓.</p>
<p>For $6x\equiv_97$: $6x-7=9q$ would mean $3\mid6x-9q=7$, which is false. More generally, $ax\equiv_n b$ needs $\gcd(a,n)\mid b$.</p>
</div>
</article>

<article class="prob" data-id="mod10" data-topic="mod" data-src="Original (PS 5 skills)" data-diff="2" data-title="5 divides every fifth Fibonacci number">
<div class="q"><p>(a) Show $F_{n+5}=5F_{n+1}+3F_n$ for all $n\ge0$. (b) Prove by induction on $k$ that $5\mid F_{5k}$ for all $k\ge0$.</p></div>
<div class="h">(a) Expand $F_{n+5}=F_{n+4}+F_{n+3}$ repeatedly until only $F_{n+1}$ and $F_n$ remain.</div>
<div class="h">(b) Apply (a) with $n=5k$. Mod 5, the first term vanishes.</div>
<div class="s">
<p><b>(a)</b> $F_{n+2}=F_{n+1}+F_n$, $F_{n+3}=2F_{n+1}+F_n$, $F_{n+4}=3F_{n+1}+2F_n$, $F_{n+5}=5F_{n+1}+3F_n$.</p>
<p><b>(b)</b> $P(k)$: $5\mid F_{5k}$. Base: $F_0=0$. Step: $F_{5k+5}=5F_{5k+1}+3F_{5k}\equiv_5 3F_{5k}\equiv_5 0$ by $P(k)$.</p>
<p>By induction, $P(k)$ holds for all $k\ge0$. ∎</p>
</div>
</article>

<article class="prob" data-id="mod11" data-topic="mod" data-src="Original" data-diff="2" data-title="aᵖ ≡ a for every a">
<div class="q"><p>Let $p$ be prime. Prove $a^p\equiv_pa$ for <i>every</i> integer $a$, including multiples of $p$.</p></div>
<div class="h">Cases: $p\mid a$, or $p\nmid a$ (then use FLT and multiply by $a$).</div>
<div class="s">
<p><b>Case $p\mid a$:</b> both sides are $\equiv0$.</p>
<p><b>Case $p\nmid a$:</b> FLT gives $a^{p-1}\equiv_p1$. Multiplying by $a$ gives $a^p\equiv_pa$.</p>
<p>The cases are exhaustive. ∎ (With $p=3$ this is the Rec 2 fact $3\mid n^3-n$.)</p>
</div>
</article>

<article class="prob" data-id="mod12" data-topic="mod" data-src="Lecture 9" data-diff="3" data-title="Proof of Fermat's Little Theorem">
<div class="q"><p>Prove: if $p$ is prime and $p\nmid a$, then $a^{p-1}\equiv_p1$.</p></div>
<div class="h">Consider $a,2a,\dots,(p-1)a$ mod $p$. Show they are a rearrangement of $1,\dots,p-1$.</div>
<div class="h">No two are congruent because $a$ is invertible mod $p$. Then multiply all of them together.</div>
<div class="s">
<p>None of $ia$ ($1\le i\le p-1$) is $\equiv0$, since $p\nmid i$ and $p\nmid a$. If $ia\equiv ja$, multiplying by $a^{-1}$ gives $i\equiv j$, so $i=j$. So the $p-1$ values are distinct nonzero residues, i.e. a permutation of $1,\dots,p-1$.</p>
<p>Multiplying everything together: $(p-1)!\,a^{p-1}\equiv_p(p-1)!$. Since $\gcd((p-1)!,p)=1$, we can cancel $(p-1)!$ to get $a^{p-1}\equiv_p1$. ∎</p>
</div>
</article>

        ${COLORS.map(([n, c], i) => `<button class="swatch" data-color="${c}" aria-label="${n} marker" aria-pressed="${i === 0}"><i style="background:${c}"></i></button>`).join("")}
        <span class="sep"></span>
        ${SIZES.map(([n, w], i) => `<button data-size="${w}" aria-pressed="${i === 1}" aria-label="Line size ${n}">${n}</button>`).join("")}
        <span class="sep"></span>
        <button data-tool="erase" aria-pressed="false">Eraser</button>
        <button data-tool="pan" aria-pressed="false" title="Scroll the page with your finger instead of drawing">Scroll</button>
        <span class="sep"></span>
        <button data-act="undo">Undo</button>
        <button data-act="redo">Redo</button>
        <button data-act="more">More room</button>
        <button data-act="clear">Clear</button>
        <span class="status" aria-live="polite"></span>
      </div>
      <div class="board-frame">
        <div class="board-surface">
          <canvas aria-label="Whiteboard drawing area"></canvas>
          <span class="board-hint"${data.s.length ? " hidden" : ""}>Work it out here…</span>
        </div>
      </div>`;
    const surface = $(".board-surface", host), canvas = $("canvas", host), ctx = canvas.getContext("2d");
    const hintEl = $(".board-hint", host), statusEl = $(".status", host);
    let W = 0, dpr = 1;

    function size_() {
      dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      W = surface.clientWidth;
      canvas.style.height = data.h + "px";
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(data.h * dpr);
      draw();
    }
    function strokePath(s) {
      const p = s.p;
      ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over";
      ctx.strokeStyle = s.e ? "rgba(0,0,0,1)" : (OLD_INK[s.c] || s.c);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = s.w; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.globalAlpha = s.e ? 1 : 0.92;
      if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0], p[1], s.w / 2, 0, Math.PI * 2); ctx.fill(); return; }
      ctx.beginPath(); ctx.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length - 2; i += 2) {
        const mx = (p[i] + p[i + 2]) / 2, my = (p[i + 1] + p[i + 3]) / 2;
        ctx.quadraticCurveTo(p[i], p[i + 1], mx, my);
      }
      ctx.lineTo(p[p.length - 2], p[p.length - 1]);
      ctx.stroke();
    }
    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, data.h);
      data.s.forEach(strokePath);
      if (cur) strokePath(cur);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    }
    function persist() {
      try { localStorage.setItem(KEYB, JSON.stringify(data)); statusEl.textContent = "Saved"; }
      catch (e) { statusEl.textContent = "Board too big to save"; }
      hintEl.hidden = data.s.length > 0;
      onChange && onChange();
    }
    const pos = (e) => { const r = canvas.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10]; };

    canvas.addEventListener("pointerdown", (e) => {
      if (tool === "pan" && e.pointerType !== "pen") return;
      if (e.button !== 0 && e.pointerType === "mouse") return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const [x, y] = pos(e);
      cur = { c: color, w: tool === "erase" ? 26 : size, e: tool === "erase" ? 1 : 0, p: [x, y] };
      draw();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!cur) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evs.forEach((ev) => { const [x, y] = pos(ev); const n = cur.p.length; if (Math.abs(x - cur.p[n - 2]) + Math.abs(y - cur.p[n - 1]) > 0.8) cur.p.push(x, y); });
      draw();
    });
    const end = () => { if (!cur) return; data.s.push(cur); cur = null; redo = []; draw(); persist(); };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end);

    const tray = $(".tray", host);
    const press = (sel, btn) => $$(sel, tray).forEach((b) => b.setAttribute("aria-pressed", b === btn));
    const setTool = (t) => {
      tool = t;
      $$("[data-tool]", tray).forEach((b) => b.setAttribute("aria-pressed", b.dataset.tool === t));
      surface.classList.toggle("pan", t === "pan");
      surface.classList.toggle("erase", t === "erase");
    };
    tray.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.color) { color = b.dataset.color; press("[data-color]", b); setTool("pen"); }
      else if (b.dataset.size) { size = +b.dataset.size; press("[data-size]", b); if (tool !== "pen") setTool("pen"); }
      else if (b.dataset.tool) { setTool(tool === b.dataset.tool ? "pen" : b.dataset.tool); }
      else if (b.dataset.act === "undo") { if (data.s.length) { redo.push(data.s.pop()); draw(); persist(); } }
      else if (b.dataset.act === "redo") { if (redo.length) { data.s.push(redo.pop()); draw(); persist(); } }
      else if (b.dataset.act === "more") { data.h += 400; size_(); persist(); }
      else if (b.dataset.act === "clear") {
        if (b.dataset.armed) { data.s = []; redo = []; delete b.dataset.armed; b.textContent = "Clear"; draw(); persist(); }
        else { b.dataset.armed = "1"; b.textContent = "Tap again to clear"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Clear"; } }, 3000); }
      }
    });

    const ro = new ResizeObserver(() => { if (surface.clientWidth !== W) size_(); });
    ro.observe(surface);
    size_();
    this.count = () => data.s.filter((s) => !s.e).length;
    this.destroy = () => { ro.disconnect(); };
  }

  // ------------------------------------------------------------------ plan
  const fmtDay = (d) => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  function todayPlan() {
    const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const exact = PLAN.find((d) => d.d.getTime() === a.getTime());
    if (exact) return Object.assign({ isToday: true }, exact);
    const upcoming = PLAN.find((d) => d.d > a);
    return upcoming ? Object.assign({ isToday: false }, upcoming) : null;
  }
  function planTaskHTML(t) {
    return `<li><label><input type="checkbox" data-plan="${t.id}" ${S.plan[t.id] ? "checked" : ""}><span>${esc(t.text)}${t.link ? ` <a href="${t.link}">open</a>` : ""}</span></label></li>`;
  }
  function bindPlanChecks() {
    $$("[data-plan]", app).forEach((cb) => cb.addEventListener("change", () => { S.plan[cb.dataset.plan] = cb.checked; save(); }));
  }
  function viewPlan() {
    const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const redo = PROBS.filter((p) => ["hints", "missed"].includes(status(p.id)));
    const allTasks = PLAN.flatMap((d) => d.tasks); const done = allTasks.filter((t) => S.plan[t.id]).length;
    app.innerHTML = `
    <div class="view">
      <div class="section-head">
        <div><span class="eyebrow">Fri Oct 9 → Wed Oct 14</span><h1 style="margin-top:6px">Study plan</h1></div>
        <div style="min-width:220px"><div class="row" style="justify-content:space-between;font-size:.85rem"><span class="muted">Plan progress</span><span class="mono">${done}/${allTasks.length}</span></div>
          <div class="bar" style="margin-top:6px"><span style="width:${(100 * done) / allTasks.length}%"></span></div></div>
      </div>
      <p class="muted" style="max-width:70ch;margin:0">About 2–3 focused hours a day. Each day: read the notes, solve problems on the whiteboard <i>before</i> unlocking anything, rate yourself honestly, and tick the topic checklist. Missed a day? Fold its tasks into the next one. Everything here is a suggestion.</p>
      <div class="days">
        ${PLAN.map((d) => `
          <div class="panel day ${d.d.getTime() === a.getTime() ? "is-today" : ""}">
            <div class="date"><span>${d.d.toLocaleDateString("en-US", { weekday: "long" })}</span><b>${d.d.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</b>${d.d.getTime() === a.getTime() ? ' <span class="badge-today">TODAY</span>' : ""}</div>
            <div><div class="focus">${esc(d.focus)}</div><ul class="checklist">${d.tasks.map(planTaskHTML).join("")}</ul></div>
          </div>`).join("")}
      </div>
      <section class="panel">
        <div class="section-head"><h2>Redo list</h2><span class="muted" style="font-size:.88rem">Problems you rated "Needed hints" or "Couldn't solve"</span></div>
        ${redo.length ? `<div class="plist">${redo.map(probRowHTML).join("")}</div>` : `<p class="muted" style="margin:0">Empty. Rate problems after you unlock a solution and the ones to revisit will collect here.</p>`}
      </section>
      <section class="panel">
        <h2 style="margin-bottom:10px">During the quiz</h2>
        <ul>
          <li>Read every problem first and start with the one whose method you recognize fastest.</li>
          <li>Before any algebra, write the skeleton: method, $P(n)$, base case, inductive step. Structure earns partial credit even when the algebra stalls.</li>
          <li>For "prove unreachable", say <i>invariant</i>, check the start state, check every move type, then conclude with the Invariant Principle.</li>
          <li>For number crunching (Pulverizer, mod powers), check your final answer by multiplying back. It takes 20 seconds and catches slips.</li>
          <li>If stuck, try small cases ($n=0,1,2,3$). That is how you find the pattern or the right hypothesis.</li>
        </ul>
      </section>
    </div>`;
    bindPlanChecks();
  }

  function viewSheet() {
    app.innerHTML = `
    <div class="view">
      <div><span class="eyebrow">One-page review</span><h1 style="margin:6px 0 8px">Formula sheet</h1>
      <p class="muted" style="margin:0;max-width:68ch">Everything worth memorizing, plus fill-in-the-blank proof skeletons. Try writing each box from memory before reading it.</p></div>
      ${$("#data-sheet").innerHTML}
    </div>`;
  }

  // ------------------------------------------------------------------ mock quiz
  const MOCK_MIN = 120;
  function mockRemaining() { return S.mock ? S.mock.start + MOCK_MIN * 60000 - Date.now() : 0; }
  function fmtLong(ms) { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
  function makeMock() {
    const shuffled = TOPICS.slice().sort(() => Math.random() - 0.5);
    // always include induction, as the lecture promised one on every test
    const chosen = [TOPIC.induction, ...shuffled.filter((t) => t.id !== "induction")].slice(0, 6);
    const ids = chosen.map((t) => {
      const pool = probsFor(t.id).filter((p) => p.diff >= 2);
      const fresh = pool.filter((p) => status(p.id) === "new");
      const src = fresh.length ? fresh : pool.length ? pool : probsFor(t.id);
      return src[Math.floor(Math.random() * src.length)].id;
    });
    const order = TOPICS.map((t) => t.id);
    ids.sort((a, b) => order.indexOf(PROB[a].topic) - order.indexOf(PROB[b].topic));
    S.mock = { ids, start: Date.now() }; save(true);
  }
  function viewMock() {
    const running = S.mock && mockRemaining() > 0;
    app.innerHTML = `
    <div class="view">
      <div class="section-head">
        <div><span class="eyebrow">Exam simulation</span><h1 style="margin-top:6px">Mock quiz</h1></div>
        ${S.mock ? `<div class="countdown" style="font-size:1rem;padding:6px 12px" id="mock-clock">${fmtLong(mockRemaining())}</div>` : ""}
      </div>
      <div class="panel">
        <p style="max-width:70ch">Six problems from six different topics (always including induction), weighted toward quiz-level difficulty and toward problems you haven't seen yet. The real quiz is 2 hours, so the timer is too. Work on paper or the whiteboard, skip the hints, and rate each problem honestly when you unlock its solution.</p>
        <div class="row">
          <button class="btn" id="mock-new">${S.mock ? "Start a new mock quiz" : "Start mock quiz (2:00:00)"}</button>
          ${S.mock ? `<button class="btn ghost" id="mock-end">${running ? "End early" : "Clear"}</button>` : ""}
        </div>
      </div>
      ${S.mock ? `<section>
        <h2 style="margin-bottom:10px">${running ? "Your problems" : "Time's up. Review your problems"}</h2>
        <div class="plist">${S.mock.ids.map((id, i) => {
          const p = PROB[id];
          return `<a class="prow" href="#p-${id}"><span class="t">${i + 1}. ${esc(p.title)}</span>${pill(id)}<span class="m"><span class="muted">${esc(TOPIC[p.topic].title)}</span><span class="src">${esc(p.src)}</span>${diffDots(p.diff)}</span></a>`;
        }).join("")}</div>
      </section>` : ""}
    </div>`;
    $("#mock-new", app).addEventListener("click", () => { makeMock(); viewMock(); });
    const endBtn = $("#mock-end", app);
    if (endBtn) endBtn.addEventListener("click", () => {
      if (running) { S.mock.start = Date.now() - MOCK_MIN * 60000; } else { S.mock = null; }
      save(true); viewMock();
    });
  }

  route();
})();

</script>
