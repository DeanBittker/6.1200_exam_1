<!-- ============================================================ LOGIC -->
<section class="topic" data-id="logic" data-title="Logic &amp; Quantifiers" data-src="Lecture 1 · Rec 1 · PS 1" data-blurb="If-then statements, truth tables, 'for all' and 'there exists', translating English into logic.">
<div data-part="idea">
<p>A <b>proposition</b> is a sentence that is either true or false, like "2 + 3 = 5". Logic is the grammar that every proof in this class is written in. Most lost points here come from misreading an if-then statement or mixing up "for all" and "there exists", not from hard math.</p>
<p><b>If-then statements are promises.</b> "If it rains, I'll bring an umbrella" is only broken when it rains and I don't bring one. If it never rains, I kept my promise no matter what. That's why a statement like "if pigs fly, then I am king" counts as true: pigs never fly, so the promise can't be broken.</p>
<p><b>"For all" and "there exists" work like a game.</b> "For all x" means an opponent gets to pick x, and you have to win no matter what they pick. "There exists x" means you get to pick x yourself. The order matters:</p>
<ul>
<li>"There is one student who sleeps in every lecture" (the same student every time) is a strong claim.</li>
<li>"In every lecture, some student sleeps" (could be a different student each time) is weaker.</li>
</ul>
<p>The first one implies the second, but not the other way around.</p>
</div>
<div data-part="know">
<ul>
<li><b>When is "if P then Q" false?</b> Only when P is true and Q is false. In every other case it's true. In particular, if P is false, the whole statement is automatically true ("false implies anything").</li>
<li><b>"If P then Q" means the same as "not P, or Q".</b> Its opposite is "P is true and Q is false".</li>
<li><b>Contrapositive (same meaning):</b> "if not Q, then not P". "If it's Friday, it's a weekday" means the same as "if it's not a weekday, it's not Friday".</li>
<li><b>Converse (different meaning):</b> "if Q, then P". "If it's a weekday, it's Friday" is false even though the original is true. Don't mix these up.</li>
<li><b>Negating "and" and "or" (De Morgan's rules):</b> "not (A and B)" means "not A, or not B". "Not (A or B)" means "not A, and not B".</li>
<li><b>Negating "for all" and "there exists":</b> "not every x works" means "some x fails". "No x works" means "every x fails". When you push a "not" past a quantifier, the quantifier flips.</li>
<li>"P if and only if Q" (iff) is two promises at once: "if P then Q" <i>and</i> "if Q then P".</li>
<li><b>Checking a rule like "if even, then red"</b> (the card puzzle): only look at the cards that could break it, the ones showing an even number and the ones showing a non-red color.</li>
<li><b>Examples are not proofs.</b> The formula n² − n + 41 gives a prime for n = 0 through 40, then fails at n = 41.</li>
<li><b>Symbols you'll see:</b> ∀ = "for all", ∃ = "there exists", → = "implies / if…then", ¬ = "not", ∧ = "and", ∨ = "or", ↔ = "if and only if".</li>
</ul>
</div>
<div data-part="steps">
<p><b>A. Showing two logic formulas mean the same thing</b></p>
<ol>
<li>List the variables. With 2 variables there are 4 true/false combinations; with 3 there are 8.</li>
<li>Make a truth table: one row per combination, one column per piece of each formula, filled in from the inside out.</li>
<li>Compare the final columns of the two formulas. If they match in every row, they're equivalent. Say that sentence explicitly.</li>
<li>Shortcut (proof by cases): split on one variable being true or false. Use two facts to simplify: "if true then X" is just X, and "if false then X" is always true.</li>
</ol>
<p><b>B. Translating English into logic</b></p>
<ol>
<li>Write down what the variables range over (students? natural numbers?) and which predicates you're allowed to use.</li>
<li>"Every X is a Y" becomes "for all x, <i>if</i> x is an X <i>then</i> x is a Y". Use "if…then" under "for all".</li>
<li>"Some X is a Y" becomes "there exists x such that x is an X <i>and</i> x is a Y". Use "and" under "there exists".</li>
<li>If two variables must be different objects, say so explicitly ("and y ≠ z").</li>
<li>Build small helper predicates (like "first in line" or "is prime") and reuse them.</li>
<li>Test your formula on a tiny example (3 students, or n = 0, 1, 2), including the case where two variables are the same object.</li>
</ol>
</div>
<div data-part="example">
<p><b>Negate:</b> "Every student has a friend who is taller than them."</p>
<p><b>Step 1, structure:</b> for every student s, there exists a friend f of s who is taller than s.</p>
<p><b>Step 2, flip each quantifier and negate the inside:</b> there exists a student s such that for every friend f of s, f is <i>not</i> taller than s.</p>
<p><b>In plain English:</b> some student has no friend taller than them.</p>
<p class="muted">In symbols: ∀s ∃f (Friend(f,s) ∧ Taller(f,s)) becomes ∃s ∀f (Friend(f,s) → ¬Taller(f,s)).</p>
</div>
<div data-part="traps">
<ul>
<li>Writing "for all n, (n &gt; 2 <b>and</b> …)" when you meant "for all n, (<b>if</b> n &gt; 2 <b>then</b> …)". The first version claims every number is bigger than 2. This was the common mistake on PS 1 #3.</li>
<li>Treating the converse as if it meant the same as the original.</li>
<li>Forgetting that "for all y" includes y being the same object as x (Rec 1 #2a: nobody is to the left of themselves).</li>
<li>Assuming "there exist y and z" gives you two <i>different</i> things. It doesn't unless you say so.</li>
<li>Swapping the order of "for all" and "there exists".</li>
</ul>
</div>
<div data-part="check">
<li>I can say exactly when an if-then statement is false, and why "false implies anything" is true.</li>
<li>I can write the contrapositive and the converse of a statement and say which one means the same thing.</li>
<li>I can negate a sentence with several "for all" and "there exists" parts.</li>
<li>I can prove two formulas are equivalent with a truth table and with cases.</li>
<li>I can translate an English sentence into logic, including "these two are different".</li>
</div>
</section>

<!-- ============================================================ PROOFS -->
<section class="topic" data-id="proofs" data-title="Proof Techniques" data-src="Lecture 2 · Lecture 3 · Rec 2–3 · PS 1–2" data-blurb="Direct proof, contrapositive, contradiction, cases, examples and counterexamples.">
<div data-part="idea">
<p>A proof is a chain of logical steps from things you already know to the thing you want. The most useful first move is to look at <b>what kind of statement</b> you're proving, because that tells you which technique to use.</p>
<div class="table-wrap"><table>
<thead><tr><th>The claim says…</th><th>What to do</th></tr></thead>
<tbody>
<tr><td>"There exists something with property P"</td><td>Give one specific example and check it has the property.</td></tr>
<tr><td>"Every x has property P"</td><td>Pick an arbitrary x (assume nothing special about it) and show it has the property.</td></tr>
<tr><td>"If P, then Q"</td><td><b>Direct:</b> assume P is true and work your way to Q. <b>Contrapositive:</b> assume Q is false and show P must be false.</td></tr>
<tr><td>"P if and only if Q"</td><td>Prove both directions as two separate mini-proofs.</td></tr>
<tr><td>"X is irrational" / "no such thing exists"</td><td><b>Contradiction:</b> assume the opposite and show it leads to something impossible.</td></tr>
<tr><td>The behaviour depends on which situation you're in</td><td><b>Cases:</b> split into situations that cover every possibility and prove each one.</td></tr>
<tr><td>You think "every x has property P" is false</td><td>Give one counterexample. That's enough.</td></tr>
</tbody></table></div>
</div>
<div data-part="know">
<ul>
<li><b>Why contradiction works:</b> if assuming "P is false" leads to something impossible, then P can't be false, so it's true.</li>
<li><b>√2 is irrational.</b> Suppose √2 = a/b, a fraction in lowest terms. Squaring gives 2b² = a², so a² is even, so a is even. Then a² is a multiple of 4, so 2b² is a multiple of 4, so b² is even, so b is even. Now both a and b are even, so the fraction wasn't in lowest terms. Contradiction.</li>
<li><b>log₂ 9 is irrational.</b> Suppose it equals m/n. Then 2 to the power m/n equals 9, so 2<sup>m</sup> = 9<sup>n</sup>. The left side is even and the right side is odd. Contradiction.</li>
<li><b>Cases must cover everything.</b> Say in one sentence why your cases are exhaustive. If two cases are mirror images (friends vs strangers in the 6-person proof), you can say "the same argument with the roles swapped".</li>
<li><b>Absolute values:</b> split at the points where each |x + a| switches sign. Rec 3 #4 uses 4 intervals.</li>
<li>You can use basic facts without proof: rational plus/minus/times/divided by rational is rational. If you use a fact about <i>irrational</i> numbers, prove it first.</li>
</ul>
</div>
<div data-part="steps">
<ol>
<li>Read the claim and decide which row of the table above it fits.</li>
<li>For an "if and only if", plan two separate proofs, one per direction.</li>
<li>Announce the method in your first sentence, for example "Proof by contradiction. Assume, for the sake of contradiction, that √2 is rational." Say <i>exactly</i> what you're assuming.</li>
<li>Write each step and say why it's allowed: a definition, your assumption, or a known fact.</li>
<li>Point out where the contradiction happens (or where each case ends) and finish with a conclusion sentence.</li>
</ol>
</div>
<div data-part="example">
<p><b>Claim (Rec 2 #3):</b> if a × b = n, where a, b, n are nonnegative numbers, then at least one of a, b is at most √n.</p>
<p><b>Proof by contradiction.</b> Suppose both are bigger: a &gt; √n and b &gt; √n. Multiplying two inequalities between nonnegative numbers gives a × b &gt; √n × √n = n. But a × b = n, so this is impossible. ∎</p>
</div>
<div data-part="traps">
<ul>
<li><b>Backwards proof:</b> starting from what you want to prove and simplifying until you reach something true proves nothing, because false statements can lead to true ones (PS 2 #3g). Always go from what you know toward what you want.</li>
<li>Proving only one direction of an "if and only if" (the most common PS 2 #2 mistake).</li>
<li>Getting the contrapositive wrong. For "if P then Q" it is "if not Q then not P", not "if Q then not P".</li>
<li>Dividing by something that might be zero (PS 2 #3d).</li>
<li>Cases that miss a possibility.</li>
<li>Writing "assume it's false" without stating the exact statement you're assuming is false.</li>
</ul>
</div>
<div data-part="check">
<li>I can pick a proof technique just by reading the claim.</li>
<li>I can write the √2 and log₂ 9 irrationality proofs from memory.</li>
<li>I can prove an "if and only if" by proving both directions.</li>
<li>I can split a problem into cases that cover everything, including absolute values.</li>
<li>I can spot a backwards proof and explain why it doesn't work.</li>
</div>
</section>

<!-- ============================================================ INDUCTION -->
<section class="topic" data-id="induction" data-title="Induction" data-src="Lecture 2 · Rec 2 · Rec 5 · PS 2" data-blurb="Base case plus inductive step. Expect at least one on the quiz.">
<div data-part="idea">
<p>Picture a line of dominoes. If you knock over the first one (the <b>base case</b>), and you know every domino knocks over the next one (the <b>inductive step</b>), then all of them fall.</p>
<p>Induction proves a statement for every natural number n the same way:</p>
<ul>
<li><b>Base case:</b> show it's true for the first value (usually n = 0 or n = 1).</li>
<li><b>Inductive step:</b> show that <i>if</i> it's true for some number n, <i>then</i> it's also true for n + 1.</li>
</ul>
<p>In the inductive step you're <i>not</i> assuming the thing you want to prove. You only assume it for one particular n, and use that to show it for the next number.</p>
<p>The lecture says there will "probably be at least one induction problem on every test". Graders look for each part of the structure below, so write all of them.</p>
</div>
<div data-part="know">
<ul>
<li><b>The rule:</b> if the statement is true for 0, and "true for n" always forces "true for n + 1", then it's true for every natural number.</li>
<li>You can start at any number (say 5) if the claim is only for n ≥ 5. You can also check several base cases.</li>
<li><b>P(n) is a sentence, not a number.</b> It's either true or false. Never write something like "P(n + 1) = P(n) + (n + 1)²".</li>
<li>Don't write "for all n" inside P(n), and don't put big-O inside P(n). That's how the bogus "2ⁿ is O(1)" proof works.</li>
<li><b>Strengthening the hypothesis:</b> sometimes proving a <i>stronger</i> statement is easier, because in the inductive step you get to assume more. Example: tiling a 2ⁿ × 2ⁿ courtyard works with Bill's statue <i>anywhere</i>, not just in the center.</li>
<li><b>Sum problems:</b> split the sum up to n + 1 into (the sum up to n) + (the last term). Replace the sum up to n using your assumption.</li>
<li><b>Divisibility problems:</b> rewrite the n + 1 expression as the n expression plus something that's obviously divisible. Example: (n+1)³ − (n+1) = (n³ − n) + 3(n² + n).</li>
</ul>
</div>
<div data-part="steps">
<ol>
<li>Write "<b>Proof by induction on n.</b>"</li>
<li>Write "Let P(n) be the statement that …" and copy the exact claim in terms of n.</li>
<li><b>Base case:</b> plug in the starting value and check both sides are equal (or the claim holds). Show the arithmetic.</li>
<li><b>Inductive step:</b> write "Let n be arbitrary and assume P(n), that is, [write it out]. We need to show P(n + 1), that is, [write it out with n + 1 plugged in]."</li>
<li>Start from one side of the n + 1 version. Find the piece that looks like the n version, replace it using your assumption, and write "by P(n)" next to that step. Then simplify until you reach the other side.</li>
<li><b>Conclusion:</b> "So P(n) implies P(n + 1) for every n, and by induction P(n) is true for all n."</li>
<li>Double-check that your inductive step works for the <i>smallest</i> n it has to cover (that's where the horses proof breaks).</li>
</ol>
</div>
<div data-part="example">
<p><b>Claim:</b> n³ − n is divisible by 3 for every natural number n.</p>
<p><b>P(n):</b> "3 divides n³ − n".</p>
<p><b>Base case (n = 0):</b> 0³ − 0 = 0, and 3 divides 0.</p>
<p><b>Inductive step:</b> assume 3 divides n³ − n. We need 3 to divide (n+1)³ − (n+1). Expanding: (n+1)³ − (n+1) = n³ + 3n² + 2n = (n³ − n) + 3(n² + n). The first part is divisible by 3 by our assumption. The second part is 3 times a whole number. A sum of two multiples of 3 is a multiple of 3.</p>
<p><b>Conclusion:</b> by induction, it's true for every n. ∎</p>
</div>
<div data-part="traps">
<ul>
<li><b>Horses:</b> the step linked the two groups of horses through the horses in the middle, but when n = 1 there are no horses in the middle. Always test your step at the base value.</li>
<li><b>Sand:</b> an inductive step that's simply false ("surely I can lift one more grain").</li>
<li>Starting from the n + 1 statement and simplifying it down to something true (a backwards proof).</li>
<li>Misreading what P(n) actually says, e.g. being off by a factor of 2 (PS 2 #3f).</li>
<li>Using the same letter for two things, like "assume P(n) for n = 1 to n".</li>
<li>Forgetting the base case or the conclusion sentence.</li>
</ul>
</div>
<div data-part="check">
<li>I can write the full induction template from memory.</li>
<li>I can prove a sum formula by induction (for example, the sum of the first n squares).</li>
<li>I can prove a divisibility claim by induction.</li>
<li>I can explain what goes wrong in the horses proof and the "2ⁿ is O(1)" proof.</li>
<li>I know when and how to make the induction hypothesis stronger.</li>
</div>
</section>

<!-- ============================================================ STRONG -->
<section class="topic" data-id="strong" data-title="Strong Induction" data-src="Lecture 3 · Rec 3 · PS 2" data-blurb="Assume every smaller case. Splitting games, postage stamps, tournament orderings.">
<div data-part="idea">
<p>Same dominoes, but when you're proving the statement for n, you're allowed to use it for <b>every</b> smaller number, not just n − 1.</p>
<p>Use it when an object of size n breaks into smaller pieces whose sizes you can't predict. Examples: splitting a stack of blocks, breaking a chocolate bar, peeling off a big prime, or dividing tournament players into winners and losers.</p>
<p>Strong induction isn't actually more powerful than regular induction (each can prove the other). It's just more convenient to write.</p>
</div>
<div data-part="know">
<ul>
<li><b>The rule:</b> if the statement is true for the first value, and "true for every number up to n" forces "true for n + 1", then it's true for every number.</li>
<li><b>How many base cases?</b> If your step reaches back k steps, you need k base cases in a row. Postage with 3¢ and 5¢ stamps reaches back 3 (add one 3¢ stamp to n − 3), so you prove 8, 9 and 10 directly.</li>
<li><b>"Every strategy gives the same answer" problems:</b> make P(n) talk about <i>all</i> strategies (or all objects) of size n, not one specific one.</li>
<li><b>Two size numbers</b> (like an m × n chocolate bar): induct on one combined number, like the area k. Then P(k) says "for every bar of area k …".</li>
<li>When you split something of size n into two nonempty pieces, both pieces are strictly smaller than n, so your assumption covers them.</li>
<li><b>Results to know:</b>
  <ul>
  <li>The block-splitting game always scores n(n − 1)/2.</li>
  <li>Breaking an m × n chocolate bar always takes mn − 1 breaks.</li>
  <li>Every round-robin tournament has a "beats ordering".</li>
  <li>With 3¢ and 5¢ stamps you can make 3, 5, 6 and every amount from 8 up.</li>
  </ul></li>
</ul>
</div>
<div data-part="steps">
<ol>
<li>Choose what n measures (number of blocks, area, number of players, amount of postage).</li>
<li>Define P(n) so it covers <i>every</i> object or strategy of size n.</li>
<li>Look at the first move (the first split, the first prime removed, one stamp added) and note which smaller sizes appear.</li>
<li>Those sizes tell you how many base cases you need. Prove each base case directly.</li>
<li>Write: "Let n be bigger than the last base case, and assume P is true for every size from the base up to n − 1. We prove P(n)."</li>
<li>Apply your assumption to the smaller pieces, checking each piece's size really is in that range. Combine the results.</li>
<li>Conclude: "By strong induction, P(n) is true for all n."</li>
</ol>
</div>
<div data-part="example">
<p><b>Chocolate bar (Rec 3 #3).</b> P(k): every way of breaking any bar of area k into single squares uses exactly k − 1 breaks.</p>
<p><b>Base case (k = 1):</b> a single square needs no breaks, and 1 − 1 = 0.</p>
<p><b>Inductive step (k ≥ 2):</b> the first break makes two pieces with areas p and q, both at least 1, adding up to k. So both are smaller than k. By assumption, finishing them takes (p − 1) + (q − 1) more breaks. Total: 1 + (p − 1) + (q − 1) = k − 1. ∎</p>
</div>
<div data-part="traps">
<ul>
<li><b>"All natural numbers are even":</b> the step for n = 1 secretly uses "1 is even", which was never proven (it needed a separate step from 0 to 1). Check which earlier cases your smallest step actually uses.</li>
<li>Reaching back to n − 3 when n − 3 is below your base case.</li>
<li>Forgetting a condition the problem demands, like the primes being different in PS 2 #5.</li>
<li>Making P(n) about one particular strategy instead of every strategy.</li>
</ul>
</div>
<div data-part="check">
<li>I can explain strong induction and why some proofs need several base cases.</li>
<li>I can do the 3¢ and 5¢ postage proof.</li>
<li>I can prove a "splitting" result (blocks game or chocolate bar).</li>
<li>I can find the bug in the "all natural numbers are even" proof.</li>
</div>
</section>

<!-- ============================================================ STATE MACHINES -->
<section class="topic" data-id="sm" data-title="State Machines &amp; Invariants" data-src="Lecture 4 · Rec 4 · PS 3 · Lecture 8 (jugs, Euclid)" data-blurb="Proving a state can't be reached, and proving a process always stops.">
<div data-part="idea">
<p>A state machine describes anything that moves step by step, like a puzzle, a robot or an algorithm. It has:</p>
<ul>
<li><b>states:</b> every possible situation;</li>
<li>a <b>start state:</b> where you begin;</li>
<li><b>transitions:</b> the legal moves from one state to another.</li>
</ul>
<p>Quiz questions come in three flavours:</p>
<ul>
<li><b>"Can it ever reach this state?"</b> Find a property that's true at the start and stays true after every move. This is called an <b>invariant</b>. If the target state doesn't have the property, it can never be reached.</li>
<li><b>"Does it always stop, and how fast?"</b> Find a whole number, zero or bigger, that goes down on every move. It can't go down forever, so the machine must stop.</li>
<li><b>"Is the answer right when it stops?"</b> Combine the invariant with what the final state looks like.</li>
</ul>
<p>The hard part is guessing the invariant. Try a few moves by hand and look for what <i>doesn't</i> change: whether something is even or odd, a remainder, a difference between two numbers, an inequality, or a gcd.</p>
</div>
<div data-part="know">
<ul>
<li><b>Vocabulary:</b>
  <ul>
  <li><b>Deterministic:</b> at most one possible move from each state.</li>
  <li><b>Execution:</b> a sequence of states that starts at the start and follows legal moves.</li>
  <li><b>Reachable state:</b> one that appears in some execution.</li>
  <li><b>Final state:</b> one with no moves out.</li>
  <li><b>Terminates:</b> every execution eventually stops.</li>
  </ul></li>
<li><b>The Invariant Principle:</b> if a property is true at the start, and every move from a state with the property leads to another state with the property, then every reachable state has the property.</li>
<li><b>It only works one way.</b> If a state <i>lacks</i> the invariant, it's unreachable. If a state <i>has</i> the invariant, that doesn't prove it's reachable. WALL-E's point (60, −42) passes the "y − x is a multiple of 3" test but is still unreachable.</li>
<li><b>Proving it stops:</b> find a quantity that is always a whole number zero or bigger and strictly goes down on every move. Then the machine stops within (starting value) moves. A quantity that only "never goes up" isn't enough by itself.</li>
<li><b>Invariants worth remembering:</b>
  <ul>
  <li>8-puzzle: the number of out-of-order pairs stays odd (or stays even). The 15-puzzle uses "snake order" to count.</li>
  <li>WALL-E: y − x is always a multiple of 3, and x + 2y is never negative.</li>
  <li>Die Hard jugs: every amount is a whole-number combination of the two jug sizes.</li>
  <li>Euclid's algorithm: the gcd of the current pair equals the gcd of the original pair.</li>
  <li>Shift-and-add multiplication: r × s + a always equals x × y.</li>
  <li>Beaver fever: the perimeter of the infected region never grows.</li>
  </ul></li>
<li><b>Swap sort:</b> each swap fixes exactly one out-of-order pair, so it takes at most n(n − 1)/2 swaps.</li>
</ul>
</div>
<div data-part="steps">
<p><b>A. Proving a state can't be reached</b></p>
<ol>
<li>Describe the states, the start state and every type of move precisely, including any conditions on when a move is allowed.</li>
<li>Experiment: apply each move to a general state like (x, y) and watch how simple quantities change (x + y, y − x, parity, …).</li>
<li>State your property in words, e.g. "y − x is a multiple of 3".</li>
<li>Check it's true at the start.</li>
<li>For <b>every</b> move type, show: if the property was true before the move, it's still true after. Write one short case per move.</li>
<li>Say: "By the Invariant Principle, every reachable state has this property."</li>
<li>Show the target state doesn't have it, so it's unreachable.</li>
</ol>
<p><b>B. Proving it stops, and that the answer is right</b></p>
<ol>
<li>Find a whole-number quantity, never negative, that goes down on every move. Check each move type. The machine stops within (its starting value) moves.</li>
<li>Describe the final states: when is no move possible?</li>
<li>Combine the invariant with the final state to get the answer. Example: r × s + a = x × y, and at the end s = 0, so a = x × y.</li>
</ol>
</div>
<div data-part="example">
<p><b>WALL-E (Rec 4 #1).</b> He starts at (0, 0) and can move by (+2, −1), (−1, +2), (+1, +1) or (+1, +4). Can he reach (20, 21)?</p>
<p><b>Property:</b> "y − x is a multiple of 3".</p>
<p><b>Start:</b> 0 − 0 = 0, a multiple of 3.</p>
<p><b>Each move</b> changes y − x by −3, +3, 0 or +3. All are multiples of 3, so the property survives every move.</p>
<p><b>Conclusion:</b> every reachable point has y − x a multiple of 3. For (20, 21), y − x = 1, so it's unreachable.</p>
</div>
<div data-part="traps">
<ul>
<li>Checking only some of the move types.</li>
<li>Claiming a state <i>is</i> reachable just because it satisfies the invariant.</li>
<li>Using a "decreasing" quantity that can go negative or isn't a whole number. Fix it by adding a constant (as in the coin problem) or by showing it's always at least 0.</li>
<li>Forgetting the conditions on moves (e.g. "only allowed when there are more tails than heads").</li>
<li>Counting out-of-order pairs row by row on the 4 × 4 puzzle: there, vertical moves change the parity. Snake order works.</li>
</ul>
</div>
<div data-part="check">
<li>I can describe a puzzle or algorithm as a state machine with precise moves.</li>
<li>I can state the Invariant Principle and use it to prove a state is unreachable.</li>
<li>I can explain why passing the invariant test doesn't prove a state is reachable.</li>
<li>I can prove a machine stops using a decreasing whole number, and give a bound on the number of steps.</li>
<li>I can prove an algorithm gives the right answer (like the multiplication one) from an invariant plus the final state.</li>
</div>
</section>

<!-- ============================================================ SUMS -->
<section class="topic" data-id="sums" data-title="Sums" data-src="Lecture 5 · Rec 5 · PS 3" data-blurb="What the appendix gives you, what to memorize, how to discover new formulas and estimate sums.">
<div data-part="idea">
<p>A <b>closed form</b> is a formula you could type straight into a calculator: no "…", no Σ (the summation sign), no "add up the previous answers". There are three things you'll do with sums:</p>
<ul>
<li><b>Discover</b> a formula:
  <ul>
  <li><b>Perturbation:</b> compare the sum with a shifted copy of itself so most terms cancel.</li>
  <li><b>Guessing the shape</b> (also called an "ansatz"): assume the answer is, say, a cubic, and solve for its coefficients.</li>
  <li><b>Telescoping:</b> write each term as a difference so neighbours cancel.</li>
  </ul></li>
<li><b>Prove</b> the formula by induction (called "guess and check").</li>
<li><b>Estimate</b> a sum that has no formula with the integral method.</li>
</ul>
<p>Notation: Σ<sub>k=1</sub><sup>n</sup> f(k) just means "add up f(k) for k = 1, 2, …, n".</p>
</div>
<div data-part="know">
<ul>
<li><b>Printed on the quiz appendix, so don't memorize these. Just know when to use them:</b>
  <ul>
  <li>1 + 2 + … + n = n(n + 1)/2 <span class="given">on appendix</span></li>
  <li>1² + 2² + … + n² = n(n + 1)(2n + 1)/6 <span class="given">on appendix</span></li>
  <li>Geometric sum: 1 + x + x² + … + x<sup>n−1</sup> = (1 − xⁿ)/(1 − x), for x ≠ 1 <span class="given">on appendix</span>. Careful: it stops at x<sup>n−1</sup> (n terms). For a sum up to xⁿ, replace n with n + 1.</li>
  </ul></li>
<li><b>NOT on the appendix. Memorize these, or know how to get them fast from the ones above:</b>
  <ul>
  <li><b>Infinite geometric sum:</b> 1 + x + x² + … forever = 1/(1 − x), when x is between −1 and 1. <i>Quick derivation:</i> take the appendix formula and let n → ∞; xⁿ shrinks to 0.</li>
  <li><b>Sum of cubes:</b> 1³ + … + n³ = (n(n + 1)/2)², the square of the first appendix formula. <i>Quick derivation:</i> telescoping (Rec 5 #2), which uses the two appendix sums.</li>
  <li><b>Σ k·2ᵏ</b> = (n − 1)·2<sup>n+1</sup> + 2. <i>Quick derivation:</i> perturbation (2S − S) plus the appendix geometric sum. Don't memorize the general Σ k·xᵏ formula; re-derive it the same way if you need it.</li>
  <li><b>Both integral-method bounds</b> and the <b>harmonic number bounds</b> (below). These have no appendix shortcut, so learn them.</li>
  </ul></li>
<li><b>Integral method, for estimating a sum with no closed form.</b> Call the sum $S=\sum_{k=1}^{n}f(k)$ and the integral $I=\int_1^n f(x)\,dx$. The sum is always the integral plus <i>one</i> extra term, and that term is the first one or the last one:
<div class="formula-box">
<p><b>If f is increasing</b> (getting bigger, like $\sqrt x$ or $\ln x$):</p>
$$f(1)+\int_1^n f(x)\,dx\;\le\;\sum_{k=1}^n f(k)\;\le\;f(n)+\int_1^n f(x)\,dx$$
<p><b>If f is decreasing</b> (getting smaller, like $1/x$ or $1/x^2$):</p>
$$f(n)+\int_1^n f(x)\,dx\;\le\;\sum_{k=1}^n f(k)\;\le\;f(1)+\int_1^n f(x)\,dx$$
<p><b>How to remember it:</b> the lower bound adds the <i>smaller</i> end term and the upper bound adds the <i>bigger</i> end term. For increasing f the smaller term is f(1); for decreasing f it's f(n). The gap between the bounds is always |f(n) − f(1)|.</p>
</div>
<b>Creating the bound, step by step:</b>
<ol>
<li>Name $f$ so that the sum is $\sum_{k=1}^n f(k)$. Example: $\sum_{k=1}^n \frac1k$ gives $f(x)=\frac1x$.</li>
<li>Say whether $f$ is increasing or decreasing on $[1,n]$, and why (e.g. "$1/x$ is decreasing for $x\gt0$").</li>
<li>Compute $I=\int_1^n f(x)\,dx$. Example: $\int_1^n\frac{dx}x=\ln n-\ln1=\ln n$.</li>
<li>Compute the two end terms $f(1)$ and $f(n)$. Example: $f(1)=1$, $f(n)=\frac1n$.</li>
<li>Plug into the matching line above. Example (decreasing): $\frac1n+\ln n\le H_n\le 1+\ln n$.</li>
<li>Write one sentence: "By the integral method, since $f$ is decreasing on $[1,n]$, …"</li>
</ol>
<b>Tighter bound (when the gap is too big):</b> add the first $m-1$ terms exactly and use the integral only from $m$ on. For decreasing $f$ and an infinite sum:
$$\underbrace{\sum_{k=1}^{m-1}f(k)}_{\text{exact}}+\int_m^\infty f(x)\,dx\;\le\;\sum_{k=1}^{\infty}f(k)\;\le\;\underbrace{\sum_{k=1}^{m-1}f(k)}_{\text{exact}}+\int_m^\infty f(x)\,dx+f(m)$$
Now the gap is only $f(m)$, so pick $m$ big enough that $f(m)$ is as small as you need (PS 3 #5).</li>
<li><b>Results from the integral method:</b>
  <ul>
  <li>The harmonic number H<sub>n</sub> = 1 + 1/2 + … + 1/n is between ln n + 1/n and ln n + 1. So it grows like ln n.</li>
  <li>√1 + √2 + … + √n is about (2/3)·n<sup>3/2</sup>.</li>
  <li>n! is between e(n/e)ⁿ and en(n/e)ⁿ.</li>
  </ul></li>
<li><b>Money (annuities):</b> with interest rate p, a dollar k years from now is worth (1/(1 + p))<sup>k</sup> dollars today. A string of yearly payments is a geometric sum.</li>
<li>A sum with no terms (like adding from 1 up to 0) equals 0.</li>
</ul>
</div>
<div data-part="steps">
<ol>
<li><b>Recognize it.</b> If it's one of the three appendix sums, cite it ("by the formula on the appendix"). Check the limits first: do they start at 0 or 1, and end at n or n − 1? If it's close to an appendix sum, rewrite it into that form (split it up, pull out constants, shift the index).</li>
<li><b>Sum inside a sum:</b> work out the inner sum first, as a formula in the outer variable, then do the outer sum.</li>
<li><b>Perturbation:</b> write the sum S. Underneath, write x·S (or S written backwards) with matching terms lined up. Subtract (or add) column by column; most terms cancel. Solve for S.</li>
<li><b>Guess the shape:</b> for 1<sup>d</sup> + 2<sup>d</sup> + … + n<sup>d</sup>, guess a polynomial of degree d + 1. Plug in n = 0, 1, 2, … to solve for the coefficients, then prove it by induction.</li>
<li><b>Telescoping:</b> if each term is (something at k + 1) minus (the same thing at k), everything cancels except the last minus the first.</li>
<li><b>No formula exists:</b> use the integral method with the 6 steps above (name f, increasing or decreasing, integral, end terms, plug in, sentence). If the bounds are too far apart, add the first few terms exactly and integrate only the rest.</li>
<li>If the question says "prove", finish with induction. Perturbation alone only finds the answer.</li>
</ol>
</div>
<div data-part="example">
<p><b>Find S = 1·2 + 2·2² + 3·2³ + … + n·2ⁿ by perturbation.</b></p>
<p><b>Double it:</b> 2S = 1·2² + 2·2³ + … + n·2<sup>n+1</sup>.</p>
<p><b>Subtract S from 2S:</b> line up matching powers of 2. In each column the coefficients differ by 1, so you get −(2 + 2² + … + 2ⁿ), plus the leftover last term n·2<sup>n+1</sup>.</p>
<p>So S = n·2<sup>n+1</sup> − (2<sup>n+1</sup> − 2) = (n − 1)·2<sup>n+1</sup> + 2.</p>
<p><b>Check n = 2:</b> 2 + 8 = 10, and (1)(8) + 2 = 10. ✓</p>
</div>
<div data-part="traps">
<ul>
<li>Perturbation on a sum that adds up to infinity gives nonsense (it "proves" 1 + 2 + 4 + … = −1).</li>
<li>Off-by-one errors: does the sum start at k = 0 or k = 1? End at n or n − 1?</li>
<li>Using the increasing-function bound for a decreasing function (or the other way round).</li>
<li>The integral method's error is too big: add the first few terms exactly (PS 3 #5).</li>
<li>In a sum inside a sum, using the outer letter where the inner one belongs (even the official PS 3 #3b solution has this typo).</li>
</ul>
</div>
<div data-part="check">
<li>I know which sums are on the appendix, and I can write Σk³, the infinite geometric sum and both integral bounds from memory.</li>
<li>I can derive the geometric sum formula by perturbation.</li>
<li>I can use the "guess the shape" method to find the formula for 1² + … + n².</li>
<li>I can apply the integral method in the right direction and tighten it by adding the first few terms by hand.</li>
<li>I can work out a sum inside a sum, inner one first.</li>
</div>
</section>

<!-- ============================================================ ASYMPTOTICS -->
<section class="topic" data-id="asym" data-title="Asymptotics" data-src="Lecture 6 · Rec 6 · PS 4" data-blurb="Big-O and friends: comparing how fast functions grow.">
<div data-part="idea">
<p>Asymptotics compares how fast two functions grow when n gets huge, ignoring details that don't matter in the long run (like constant factors or small extra terms). Think "which algorithm will win on a giant input?"</p>
<p>The six comparisons, in words (f and g are the two functions):</p>
<div class="table-wrap"><table>
<thead><tr><th>Written</th><th>Read as</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td>f = O(g)</td><td>big-O</td><td>f grows <b>no faster</b> than g (up to a constant factor). Like "≤".</td></tr>
<tr><td>f = Ω(g)</td><td>big-Omega</td><td>f grows <b>at least as fast</b> as g. Like "≥".</td></tr>
<tr><td>f = Θ(g)</td><td>Theta</td><td>f and g grow at the <b>same rate</b>, up to constant factors. Like "=".</td></tr>
<tr><td>f = o(g)</td><td>little-o</td><td>f grows <b>much slower</b>: f/g shrinks to 0. Like "&lt;".</td></tr>
<tr><td>f = ω(g)</td><td>little-omega</td><td>f grows <b>much faster</b>: f/g blows up to infinity. Like "&gt;".</td></tr>
<tr><td>f ∼ g</td><td>asymptotically equal</td><td>f/g gets closer and closer to <b>exactly 1</b>. Constant factors matter here.</td></tr>
</tbody></table></div>
</div>
<div data-part="know">
<ul>
<li><b>Formal definition of big-O</b> <span class="given">on appendix</span><b>:</b> f is O(g) if there is some constant c and some starting point n₀ so that from n₀ onwards, f(n) is never more than c times g(n). In symbols: $|f(n)|\le c\cdot g(n)$ for all $n\ge n_0$.</li>
<li>f is Ω(g) exactly when g is O(f). f is Θ(g) when both hold.</li>
<li><b>The limit test (the fastest way to decide):</b> compute what f(n)/g(n) approaches as n grows.
  <ul>
  <li>It goes to 0: little-o (and big-O).</li>
  <li>It goes to a positive number: Theta. If that number is exactly 1, also ∼.</li>
  <li>It goes to infinity: little-omega (and big-Omega).</li>
  <li>It doesn't settle down (it bounces around): go back to the definition. For example, 3 + sin n bounces between 2 and 4, but it's still O(1).</li>
  </ul></li>
<li><b>Growth ladder, from slowest to fastest:</b> constants &lt; log n &lt; (log n)<sup>300</sup> &lt; √n &lt; n &lt; n log n &lt; n² &lt; n<sup>100</sup> &lt; 1.01ⁿ &lt; 2ⁿ &lt; 4ⁿ &lt; n! &lt; nⁿ.</li>
<li><b>The base of a log doesn't matter</b> (changing it is a constant factor). The base of an exponential <i>does</i> matter: 4ⁿ is <i>not</i> O(2ⁿ).</li>
<li><b>∼ is stronger than Theta.</b> n and 2n are Theta of each other but not ∼, because their ratio is 2, not 1.</li>
<li>If f ∼ g, then f² ∼ g². But not 2<sup>f</sup> ∼ 2<sup>g</sup>: n + 1 ∼ n, but 2<sup>n+1</sup> is twice 2ⁿ.</li>
<li>A "lower-order term" is one whose ratio to the main term goes to 0. Adding it doesn't change ∼.</li>
<li><b>Stirling's formula</b> <span class="given">on appendix</span><b>:</b> n! ∼ √(2πn)·(n/e)ⁿ. Also H<sub>n</sub> ∼ ln n.</li>
</ul>
</div>
<div data-part="steps">
<p><b>A. "Which relationships hold between f and g?"</b></p>
<ol>
<li>Simplify each function down to its biggest term.</li>
<li>Work out what f/g approaches: divide top and bottom by the biggest term, use L'Hôpital, or take logs for exponentials and factorials.</li>
<li>Read off the answer with the limit test. If the ratio bounces around, check directly whether it stays below (or above) some constant.</li>
</ol>
<p><b>B. "Prove f is O(g), giving c and n₀"</b></p>
<ol>
<li>Bound each term of f by a multiple of g once n is big enough. Example: n² + 3n + 7 ≤ n² + 3n² + 7n² = 11n² for n ≥ 1.</li>
<li>If g has a small negative term, absorb it. Example: n − 4 is at least n/2 once n ≥ 8.</li>
<li>Write the constants explicitly ("c = 11, n₀ = 1") and check the inequality holds for <i>every</i> n from n₀ on.</li>
</ol>
<p><b>C. "Prove f is not O(g)"</b></p>
<ol>
<li>Show f/g grows without limit. Equivalently: whatever constant c someone picks, f(n) is still bigger than c·g(n) for large enough n.</li>
</ol>
</div>
<div data-part="example">
<p><b>Rec 6 #3b:</b> f(n) = (3n − 7)/(n + 4) and g(n) = 4. As n grows, f gets close to 3, so f and g are Theta of each other.</p>
<ul>
<li><b>f is O(g):</b> f(n) is always less than 3, which is less than 1 × 4. So c = 1, n₀ = 1.</li>
<li><b>g is O(f):</b> we need 4 ≤ 2·f(n). That works out to 6n − 14 ≥ 4n + 16, so n ≥ 15. So c = 2, n₀ = 15.</li>
</ul>
</div>
<div data-part="traps">
<ul>
<li><b>Never use big-O inside an induction proof.</b> The bogus "2ⁿ is O(1)" proof secretly lets the constant c change with n.</li>
<li>"f ≥ O(g)" doesn't mean anything. Use Ω for "at least".</li>
<li>Theta ignores constant factors but ∼ doesn't: n²/2 is not ∼ n².</li>
<li>Functions that bounce around (like 2 to the power ⌈log₂ n⌉, or anything with sin n) break the limit test. Use the definition.</li>
<li>Changing a log's base is just a constant factor, but raising a log to a power is not: (log n)² is not O(log n).</li>
</ul>
</div>
<div data-part="check">
<li>I can state the definition of big-O in words and use it with explicit c and n₀.</li>
<li>I can quickly fill in a "which of O, Ω, Θ, o, ω" table.</li>
<li>I know the growth ladder: logs, then powers, then exponentials, then factorials.</li>
<li>I can explain the difference between ∼ and Theta with an example.</li>
<li>I can use Stirling's formula to compare expressions with factorials.</li>
</div>
</section>

<!-- ============================================================ RECURRENCES -->
<section class="topic" data-id="rec" data-title="Recurrences" data-src="Lecture 7 · Rec 7 · PS 4" data-blurb="Sequences defined from earlier terms: guess and check, plug and chug, Master Theorem.">
<div data-part="idea">
<p>A recurrence defines each term of a sequence using earlier terms. Example: "the cost of sorting n items is twice the cost of sorting n/2 items, plus n". You'll either want:</p>
<ul>
<li>an <b>exact formula</b> (then prove it by induction), or</li>
<li>just the <b>growth rate</b> (use the Master Theorem).</li>
</ul>
<p>The first question to ask: does the recurrence <b>subtract</b> (T(n − 1), like Towers of Hanoi) or <b>divide</b> (T(n/2), like merge sort)?</p>
<ul>
<li>Subtracting means n levels of recursion, often an exponential answer.</li>
<li>Dividing means only about log n levels, usually a polynomial answer.</li>
</ul>
</div>
<div data-part="know">
<ul>
<li><b>Towers of Hanoi:</b> moving n disks takes T(n) = 2·T(n − 1) + 1 moves, with T(1) = 1. Answer: T(n) = 2ⁿ − 1.</li>
<li><b>Merge sort:</b> T(n) = 2·T(n/2) + n − 1. When n is a power of 2, T(n) = n log₂ n − n + 1.</li>
<li><b>Plug and chug:</b> substitute the recurrence into itself again and again, spot the pattern after k rounds, choose k so you reach the base case (k = log<sub>b</sub> n), add up what's left, then confirm by induction.</li>
<li><b>Recurrences like "a(n) = 3·a(n−1) + 10·a(n−2)"</b> (each term a fixed combination of the previous few):
  <ol>
  <li>Guess a(n) = rⁿ and plug in. Dividing out gives an equation for r, the <i>characteristic equation</i>; here r² = 3r + 10, so r = 5 or −2.</li>
  <li>The general answer is a mix of those: a(n) = A·5ⁿ + B·(−2)ⁿ.</li>
  <li>Use the starting values to solve for A and B.</li>
  </ol></li>
<li><b>Fibonacci</b> grows like φⁿ, where φ = (1 + √5)/2 ≈ 1.618 (the golden ratio).</li>
<li><b>Master Theorem</b> <span class="given">on appendix</span> (so focus on <i>applying</i> it: compute c, compare, pick the case), for divide-and-conquer recurrences T(n) = a·T(n/b) + f(n), meaning: split into a pieces of size n/b, plus f(n) extra work. First compute the <b>critical exponent</b> c = log<sub>b</sub> a. Then compare the extra work f(n) with n<sup>c</sup>:
  <ul>
  <li><b>Case 1, f(n) is polynomially smaller than n<sup>c</sup>:</b> the answer is Θ(n<sup>c</sup>). The many small pieces dominate.</li>
  <li><b>Case 2, f(n) is about the same as n<sup>c</sup>:</b> the answer is Θ(n<sup>c</sup> log n). Every level of the recursion does equal work.</li>
  <li><b>Case 3, f(n) is polynomially bigger than n<sup>c</sup>:</b> the answer is Θ(f(n)). The top level dominates. You must also check "regularity": a·f(n/b) ≤ k·f(n) for some k less than 1.</li>
  </ul></li>
<li>"Polynomially" means by a factor of n to some positive power. So n log n vs n is <i>not</i> enough of a gap, and that recurrence falls between the cases. The Master Theorem also never applies to T(n − 1) recurrences.</li>
<li><b>Counting recurrences (like Mini-Tetris tilings):</b> split into cases based on what fills the first column.</li>
</ul>
</div>
<div data-part="steps">
<ol>
<li><b>Divide-and-conquer</b> (T(n/b) in it):
  <ul>
  <li>For the growth rate, identify a, b and f(n), compute c = log<sub>b</sub> a, compare f(n) to n<sup>c</sup> and pick the case. In case 3, check regularity.</li>
  <li>For an exact answer when n is a power of b, plug and chug.</li>
  </ul></li>
<li><b>Fixed combination of previous terms:</b> write the characteristic equation, find its roots, write the general answer, then use the starting values to pin down the constants.</li>
<li><b>No obvious method:</b> compute the first 6–8 terms and look for a pattern (ratios, differences, multiplying by 3, close to a power of 2). Then prove your guess by strong induction, with as many base cases as the recurrence reaches back.</li>
<li><b>Something like 2·T(n − 1) + 1:</b> compute terms and guess, or add 1 to both sides so it becomes U(n) = 2·U(n − 1).</li>
</ol>
</div>
<div data-part="example">
<p><b>T(n) = 4·T(n/3) + n².</b></p>
<p><b>Read off the parts:</b> a = 4 pieces, each of size n/3, so b = 3. Extra work f(n) = n².</p>
<p><b>Critical exponent:</b> c = log₃ 4 ≈ 1.26.</p>
<p><b>Compare:</b> n² is polynomially bigger than n<sup>1.26</sup>, so this is case 3.</p>
<p><b>Regularity check:</b> 4·(n/3)² = (4/9)·n², and 4/9 is less than 1. ✓</p>
<p><b>Answer:</b> T(n) is Θ(n²).</p>
</div>
<div data-part="traps">
<ul>
<li>Using the Master Theorem on Hanoi-style T(n − 1) recurrences.</li>
<li>Forgetting the regularity check in case 3.</li>
<li>Thinking n log n is "polynomially bigger" than n. It isn't, so neither case 2 nor case 3 applies.</li>
<li>Finishing plug and chug without the induction check when the question says "prove".</li>
<li>Too few base cases for a recurrence that reaches back 2 or 3 steps.</li>
</ul>
</div>
<div data-part="check">
<li>I can solve a divide-and-conquer recurrence exactly with plug and chug.</li>
<li>I can apply all three Master Theorem cases and recognize when it doesn't apply.</li>
<li>I can solve a recurrence like a(n) = 3a(n−1) + 10a(n−2) with the characteristic equation and the starting values.</li>
<li>I can set up a counting recurrence (tilings) and prove its formula by strong induction.</li>
</div>
</section>

<!-- ============================================================ GCD -->
<section class="topic" data-id="gcd" data-title="Divisibility &amp; GCD" data-src="Lecture 8 · Rec 8 · Lecture 9 (start)" data-blurb="Divisibility rules, Euclid's algorithm, the Pulverizer, Bézout's identity.">
<div data-part="idea">
<p>"a divides b" (written a | b) just means b is a multiple of a: b = a × (some whole number).</p>
<p>Almost everything about gcds comes from one fact: <b>the pair (a, b) and the pair (a, b − a) have exactly the same common divisors.</b></p>
<ul>
<li><b>Euclid's algorithm</b> uses this to shrink the numbers fast: replace the pair (x, y) with (y, remainder of x divided by y) until the second number is 0. The other number is the gcd.</li>
<li>The <b>Pulverizer</b> runs Euclid's algorithm while also tracking how each remainder is built from a and b. At the end you get whole numbers s and t with gcd(a, b) = s·a + t·b. That this is always possible is called <b>Bézout's identity</b>.</li>
</ul>
<p><b>The Die Hard jugs make it concrete.</b> With a 3-gallon and a 5-gallon jug, every amount you can measure is "some number of 3s plus some number of 5s" (negatives allowed). That's called an <b>integer linear combination</b> of 3 and 5. Those amounts are exactly the multiples of gcd(3, 5) = 1. With 6- and 9-gallon jugs, you can only ever measure multiples of 3, so 5 gallons is impossible.</p>
</div>
<div data-part="know">
<ul>
<li><b>Divisibility rules (from Rec 8):</b>
  <ul>
  <li>If a divides b, it divides any multiple of b.</li>
  <li>If a divides b and b divides c, then a divides c.</li>
  <li>If a divides both b and c, it divides any combination s·b + t·c.</li>
  </ul></li>
<li><b>GCD facts:</b>
  <ul>
  <li>Every common divisor of a and b divides gcd(a, b).</li>
  <li>gcd(k·a, k·b) = k·gcd(a, b).</li>
  <li>If a divides b·c and a shares no factor with b, then a divides c.</li>
  <li>gcd(a, b) = gcd(b, remainder of a ÷ b).</li>
  </ul></li>
<li><b>Division with remainder:</b> any whole number n can be written uniquely as n = q·d + r with 0 ≤ r &lt; d. Here q is the quotient and r the remainder.</li>
<li>gcd(a, 0) = a (every number divides 0), and gcd(0, 0) = 0 by definition.</li>
<li><b>Bézout:</b> gcd(a, b) can always be written as s·a + t·b for some whole numbers s and t, possibly negative.</li>
<li><b>Key consequence:</b> the numbers you can write as s·a + t·b are exactly the multiples of gcd(a, b). So the gcd is the <i>smallest positive</i> such number.</li>
<li><b>Relatively prime:</b> a and b have gcd 1 exactly when you can write 1 = s·a + t·b.</li>
<li><b>Euclid as a state machine:</b> the invariant is "gcd of the current pair = gcd of the original pair". It stops when the second number hits 0. It's fast: the numbers at least halve every two steps.</li>
<li>If a prime p divides a·b, then p divides a or p divides b.</li>
<li><b>Fixing signs:</b> if s·a + t·b = g, you can add b/g to s and subtract a/g from t and still get g. Use this when you need a positive answer (the Hoppip problem).</li>
</ul>
</div>
<div data-part="steps">
<p><b>Running the Pulverizer</b> (one row per division step)</p>
<ol>
<li>Start with x = a and y = b. Divide: x = q·y + r. Write the remainder as r = a − q·b, which is already a combination of a and b.</li>
<li>Next row: the old y becomes the new x and the remainder becomes the new y. Divide again and write r = x − q·y.</li>
<li><b>Substitute:</b> replace x and y with the combinations of a and b you found in earlier rows, then collect the a's and b's.</li>
<li>Stop when the remainder is 0. The last nonzero remainder is the gcd, and its row gives s and t.</li>
<li><b>Check</b> by multiplying out s·a + t·b. It must equal the gcd. This takes 20 seconds and catches slips.</li>
<li>If you need positive coefficients, shift them as described above.</li>
</ol>
<p><b>Divisibility proofs:</b> turn "a divides b" into "b = a × k for some whole number k", do algebra with those equations, and turn the result back into a divisibility statement. To show two numbers have gcd 1, take any common divisor d and show it must divide 1.</p>
</div>
<div data-part="example">
<p><b>Find gcd(259, 70) and write it as a combination of 259 and 70.</b></p>
<ul>
<li>259 = 3·70 + 49, so 49 = 259 − 3·70.</li>
<li>70 = 1·49 + 21, so 21 = 70 − 49 = 70 − (259 − 3·70) = −1·259 + 4·70.</li>
<li>49 = 2·21 + 7, so 7 = 49 − 2·21 = (259 − 3·70) − 2(−259 + 4·70) = 3·259 − 11·70.</li>
<li>21 = 3·7 + 0. The remainder is 0, so stop.</li>
</ul>
<p><b>Answer:</b> gcd = 7 = 3·259 − 11·70. Check: 777 − 770 = 7. ✓</p>
</div>
<div data-part="traps">
<ul>
<li>Arithmetic slips while substituting. Check each row by plugging in the actual numbers.</li>
<li>Expecting the Pulverizer to give positive coefficients. It often gives one negative.</li>
<li>Treating "a divides b" as a number (like a/b). It's a true/false statement.</li>
<li>Forgetting that every number divides 0.</li>
</ul>
</div>
<div data-part="check">
<li>I can run Euclid's algorithm and the Pulverizer by hand without errors.</li>
<li>I can explain why the jug amounts you can measure are exactly the multiples of the gcd.</li>
<li>I can prove a gcd fact using "a, b and a, b − a have the same common divisors".</li>
<li>I can prove that consecutive Fibonacci numbers have gcd 1.</li>
</div>

<section class="topic" data-id="mod" data-title="Modular Arithmetic" data-src="Lecture 9 · Rec 9" data-blurb="Clock arithmetic: remainders, inverses, Fermat's Little Theorem, fast powers.">
<div data-part="idea">
<p>Modular arithmetic is <b>clock arithmetic</b>: working "mod n" means you ignore multiples of n and only keep the remainder. 3 PM plus 49 hours is 4 PM, because 49 = 2 × 24 + 1.</p>
<p>"a is congruent to b mod n" (written a ≡ b (mod n), or a ≡<sub>n</sub> b) means a and b leave the same remainder when divided by n. Equivalently, n divides a − b. Example: 17 ≡ 2 (mod 5), because both leave remainder 2.</p>
<p><b>The big rule:</b> when adding, subtracting or multiplying, you can swap any number for its remainder at any time, and the final remainder comes out the same. This includes the <i>base</i> of a power. Two things do <b>not</b> work this way:</p>
<ul>
<li>You can't reduce an <b>exponent</b> mod n.</li>
<li>You can't <b>divide</b> unless the number has an inverse.</li>
</ul>
</div>
<div data-part="know">
<ul>
<li><b>Same remainder</b> = congruent = n divides their difference. All three mean the same thing.</li>
<li><b>Replace freely:</b> if a and b are congruent, and c and d are congruent, then a + c ≡ b + d and a × c ≡ b × d. Also aᵏ ≡ bᵏ, so you can shrink the base.</li>
<li><b>Never shrink the exponent mod n.</b> 1 ≡ 6 (mod 5), but 2¹ = 2 and 2⁶ = 64 ≡ 4 (mod 5) are different.</li>
<li><b>Inverses ("dividing"):</b> a has an inverse mod n (a number you can multiply by to get 1) exactly when gcd(a, n) = 1. To find it, run the Pulverizer: if s·a + t·n = 1, then s is the inverse of a.</li>
<li><b>Fermat's Little Theorem (FLT)</b> <span class="given">on appendix</span><b>:</b> if p is prime and p doesn't divide a, then a<sup>p−1</sup> ≡ 1 (mod p). Two uses:
  <ul>
  <li>The inverse of a is a<sup>p−2</sup>.</li>
  <li>For a prime modulus, exponents <i>can</i> be shrunk, but mod p − 1, not mod p.</li>
  </ul></li>
<li><b>Canceling:</b> you can cancel a factor k from both sides only if gcd(k, n) = 1. Counterexample: 3·5 ≡ 3·1 (mod 6), but 5 is not ≡ 1 (mod 6).</li>
<li><b>Negative remainders are handy:</b> 99 ≡ −1 (mod 100) and 96 ≡ −1 (mod 97). Then (−1) to any power is just ±1.</li>
<li><b>Digit tricks:</b> 10 ≡ 1 (mod 9), so any number has the same remainder mod 9 as the sum of its digits. The last digit is the remainder mod 10; the last two digits are the remainder mod 100.</li>
<li>In this class the remainder is always between 0 and n − 1, even for negative numbers: −43 mod 10 = 7.</li>
<li><b>Repeated squaring:</b> to get a huge power fast, compute a², a⁴, a⁸, … by squaring each previous answer, then multiply together the ones you need. Example: a<sup>50</sup> = a<sup>32</sup> · a<sup>16</sup> · a².</li>
</ul>
</div>
<div data-part="steps">
<p><b>A. Finding the remainder of a huge power (aᵉ mod n)</b></p>
<ol>
<li>Replace the base by its remainder mod n. Try a negative one if it's close to n (like 99 → −1).</li>
<li>Compute the first few powers and look for one that equals 1 or −1, or a repeating cycle. Then split the exponent: e = (multiple of the cycle length) + leftover.</li>
<li>If n is prime and doesn't divide a, you may shrink the exponent mod n − 1 (Fermat's Little Theorem).</li>
<li>Otherwise use repeated squaring.</li>
<li>Take the remainder after every multiplication so the numbers stay small.</li>
</ol>
<p><b>B. Solving a·x ≡ b (mod n)</b></p>
<ol>
<li>Check gcd(a, n) = 1. If so, find the inverse of a (Pulverizer or FLT).</li>
<li>Multiply both sides by that inverse: x ≡ (inverse of a) × b.</li>
<li>Check by plugging x back in.</li>
</ol>
</div>
<div data-part="example">
<p><b>Find the remainder of 3<sup>101</sup> divided by 21.</b></p>
<p><b>Powers of 3 mod 21:</b> 3, 9, 27 → 6, 18, 54 → 12, 36 → 15, 45 → 3, … The pattern repeats every 6 powers, starting from 3¹.</p>
<p><b>Split the exponent:</b> 101 = 1 + 6 × 16 + 4. So 3<sup>101</sup> has the same remainder as 3⁵, which is 12.</p>
<p><b>Check:</b> 3⁵ = 243 = 11 × 21 + 12. ✓</p>
</div>
<div data-part="traps">
<ul>
<li>Shrinking an exponent mod n instead of mod p − 1, or using Fermat's Little Theorem when n isn't prime.</li>
<li>"Dividing" both sides by a number that shares a factor with n.</li>
<li>Mixing up "a is congruent to b mod n" (a relationship) with "a equals the remainder of b" (a single value).</li>
<li>Programming-language % can give negative remainders. In this class remainders are never negative.</li>
</ul>
</div>
<div data-part="check">
<li>I can find remainders of huge powers using cycles, Fermat's Little Theorem or repeated squaring.</li>
<li>I can find a modular inverse two ways (Pulverizer and Fermat) and check it.</li>
<li>I can solve a·x ≡ b (mod n) when gcd(a, n) = 1.</li>
<li>I can prove the divisible-by-9 digit-sum rule.</li>
<li>I can state Fermat's Little Theorem with its conditions and sketch why it's true.</li>
</div>
